[package]
name = "prism-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3

[patch.crates-io]
zed-async-tar = { path = "vendor/zed-async-tar" }
