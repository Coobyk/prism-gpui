[package]
name = "prism-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "socks-proxy", "gzip"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
walkdir = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"
libloading = "0.8"
semver = "1"
tar = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3

[patch.crates-io]
zed-async-tar = { path = "vendor/zed-async-tar" }
